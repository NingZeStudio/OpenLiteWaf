# nginx.conf — OpenLiteWaf 随附的 OpenResty 主配置
# 基于 openresty/docker-openresty 镜像内置 nginx.conf，新增 OpenLiteWaf 所需的
# http 级指令。挂载目标：/usr/local/openresty/nginx/conf/nginx.conf

worker_processes  auto;

# 启用 PCRE JIT，加速 ngx.re 规则匹配
pcre_jit  on;

#error_log  logs/error.log  notice;

events {
    # SSE 长连接 + 反代场景下每个客户端可能占用多条连接，1024 偏紧
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── OpenLiteWaf / OpenLiteStats ─────────────────────────────
    # Lua 模块搜索路径：OpenLiteWaf/lua 挂载到 /usr/local/openresty/nginx/lua，
    # OpenLiteStats/lua 挂载到 /usr/local/openresty/nginx/lstats（访问统计插件）
    lua_package_path '/usr/local/openresty/nginx/lua/?.lua;/usr/local/openresty/nginx/lstats/?.lua;;';
    # OpenLiteWaf：计数 / 限流 / 封禁共用（16m 约可容纳数十万键）
    lua_shared_dict openlitewaf 16m;
    # OpenLiteStats：站点访问统计独立 dict
    lua_shared_dict openlitestats 32m;
    init_by_lua_block {
        require("openlitewaf").init()
        require("openlitestats").init()
    }
    # 定时快照持久化（各自内部判断 worker 0）
    init_worker_by_lua_block {
        require("openlitewaf").timer()
        require("openlitestats").timer()
    }
    # ─────────────────────────────────────────────────────────

    # 可写路径（docker-openresty 默认值）
    client_body_temp_path  /var/run/openresty/nginx-client-body;
    proxy_temp_path        /var/run/openresty/nginx-proxy;
    fastcgi_temp_path      /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path        /var/run/openresty/nginx-uwsgi;
    scgi_temp_path         /var/run/openresty/nginx-scgi;

    sendfile           on;
    keepalive_timeout  65;

    # ── Gzip / Brotli 传输压缩配置 ─────────────────────────────
    # Gzip 压缩（OpenResty 内置支持，兜底兼容）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # Brotli 压缩（默认推荐，优先于 Gzip）
    # 注：OpenResty 官方 Alpine 基础镜像默认未预置 ngx_brotli 动态模块。
    # 若宿主容器加载了 ngx_brotli 动态模块（在配置顶部 load_module），
    # 可取消以下指令注释开启边缘层 Brotli 压缩：
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 1024;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    #
    # 无论 Nginx 层是否加载该模块，Hyperf (Swoole) 后端均已开启原生 http_compression，
    # 客户端发送 Accept-Encoding: br 时默认优先由后端采用 Brotli 压缩，经反代透明直达。
    # ─────────────────────────────────────────────────────────

    include /etc/nginx/conf.d/*.conf;
}
